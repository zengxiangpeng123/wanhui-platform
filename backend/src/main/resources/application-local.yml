spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/${DB_NAME:wanhui_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:wanhui_app}
    password: ${DB_PASSWORD:local_only_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000

wanhui:
  security:
    crypto:
      key-version: ${FIELD_KEY_VERSION:1}
      encryption-key: ${FIELD_ENCRYPTION_KEY:KJRYsRQEQB5K0Ts4HO5esrnrAKzwWILX9k00i/vsl+U=}
      hmac-key: ${FIELD_HMAC_KEY:1i209Ai9K09b4CTGEGUFH9DLncSUYLpUcAusxLaMY/k=}
