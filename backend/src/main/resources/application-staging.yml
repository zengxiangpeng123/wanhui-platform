spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:wanhui}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:wanhui_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000

server:
  forward-headers-strategy: framework

wanhui:
  security:
    crypto:
      key-version: ${FIELD_KEY_VERSION:1}
      encryption-key: ${FIELD_ENCRYPTION_KEY}
      hmac-key: ${FIELD_HMAC_KEY}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
