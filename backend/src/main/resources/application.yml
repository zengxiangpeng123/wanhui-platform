spring:
  application:
    name: wanhui-backend
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
