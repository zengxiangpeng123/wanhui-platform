services:
  mysql:
    image: mysql:8.0
    container_name: wanhui-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      MYSQL_DATABASE: ${DB_NAME:-wanhui_dev}
      MYSQL_USER: ${DB_USERNAME:-wanhui_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_only_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-wanhui_app}", "-p${MYSQL_PASSWORD:-local_only_password}"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_dev_data:
