name: wanhui-prod

services:
  mysql:
    image: mysql:8.0
    container_name: wanhui-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.prod}
      MYSQL_DATABASE: ${DB_NAME:-wanhui}
      MYSQL_USER: ${DB_USERNAME:-wanhui_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - wanhui-internal

  app:
    image: ${APP_IMAGE_TAG:?set APP_IMAGE_TAG}
    container_name: wanhui-app-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-wanhui}
      DB_USERNAME: ${DB_USERNAME:-wanhui_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      FIELD_KEY_VERSION: ${FIELD_KEY_VERSION:-1}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env.prod}
      FIELD_HMAC_KEY: ${FIELD_HMAC_KEY:?set FIELD_HMAC_KEY in .env.prod}
      SESSION_COOKIE_SECURE: "true"
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/liveness >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - wanhui-internal

  nginx:
    image: ${FRONTEND_IMAGE_TAG:?set FRONTEND_IMAGE_TAG}
    container_name: wanhui-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - wanhui-internal

networks:
  wanhui-internal:
    driver: bridge

volumes:
  mysql_prod_data:
